<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Tai Wai Chan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">Tai Wai Chan</div>
            <nav class="nav">
                <a href="home.html">Work</a>
                <a href="profile.html">Profile</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="success-main">
        <div class="success-card">
            <div class="success-icon">
                <img src="img/paper-plane-black.svg" class="icon-plane-black" alt="Sent">
                <img src="img/paper-plane-white.svg" class="icon-plane-white" alt="Sent">
            </div>
            
            <h1>Message Sent!</h1>
            <p>Thank you for reaching out. I have received your message and will get back to you shortly.</p>
            
            <a href="home.html" class="btn">Back to Home</a>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <nav class="footer-nav">
                    <a href="impressum.html">Impressum</a>
                    <a href="datenschutz.html">Datenschutz</a>
                </nav>
            </div>
            <div class="footer-middle">
                <p class="copyright">© 2026 Tai Wai Chan · Berlin</p>
            </div>
            <div class="footer-right">
                <button onclick="scrollToTop()" class="btn-top">↑</button>
            </div>
        </div>
    </footer>

    <div class="accessibility-menu">
        <button class="fab" onclick="toggleAccessMenu()">
            <img src="img/gear-black.svg" class="icon-gear-black" alt="Settings">
            <img src="img/gear-white.svg" class="icon-gear-white" alt="Settings">
        </button>
        <div class="access-options" id="accessOptions">
            <button onclick="changeFontSize('increase')">A+</button>
			<button onclick="changeFontSize('reset')">A</button>
            <button onclick="changeFontSize('decrease')">A-</button>
            <button id="contrast-toggle" onclick="toggleContrast()">
                <img src="img/moon.svg" alt="Dark Mode" class="icon-moon">
                <img src="img/sun.svg" alt="Light Mode" class="icon-sun">
            </button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
