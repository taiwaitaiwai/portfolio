<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZITRA - Schade</title>
	
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="icon" href="img/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="img/icon-192.png">
	
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lose-page">

  <div class="pattern-overlay">
    <img src="img/start-bg.png" alt="" class="rotating-bg">
  </div>

  <header class="topbar">
    <div class="deko-left"></div>
    <div class="deko-right"></div>
    <div class="topbar-content">
      <img src="img/zitra-logo.svg" alt="ZITRA Logo" class="logo logo-portrait">
      <img src="img/zitra-logo-vertical.svg" alt="ZITRA Vertical" class="logo logo-landscape">
    </div>
  </header>

  <main class="content-grid">

    <div class="lose-main-content">
      <section class="info-block center-text">
        <h1 class="zitra-hero-title">· SCHADE · FAST ·</h1>
        <p class="reading-text">
          Diese Dose war leider eine Niete. Kopf hoch – probier’s gleich noch mal!
        </p>
      </section>

      <div class="centered-img-block">
        <img src="img/sad-oma.png" alt="Sad Oma" class="oma-img-fixed">
      </div>
    </div>

    <div class="lose-actions-content">
      <section class="info-block center-text">
        <h2 class="sub-heading">WIR FEIERN UNSERE GEWINNER!</h2>
        <p class="reading-text">
          Schau auf unseren Kanälen vorbei und sieh dir die glücklichen Gesichter der ZITRA-Community an.
        </p>

        <div class="social-row">
          <a href="#"><img src="img/fb.svg" alt="Facebook"></a>
          <a href="#"><img src="img/insta.svg" alt="Instagram"></a>
          <a href="#"><img src="img/tiktok.svg" alt="TikTok"></a>
          <a href="#"><img src="img/youtube.svg" alt="YouTube"></a>
        </div>
      </section>
    </div>

    <!-- changed section -> div -->
    <div class="lose-cta-container">
      <a href="index.html" class="cta-button">
        <span class="cta-text">WEITER GEHT'S</span>
        <img src="img/icon-home.svg" alt="Home Icon" class="cta-icon">
      </a>
    </div>

  </main>
</body>
</html>
